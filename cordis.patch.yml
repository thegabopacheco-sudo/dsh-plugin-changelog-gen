# dsh-plugin-changelog-gen — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "changelog".
# Tools resultantes: mcp__changelog__* (ver README).
- insert:
    - id: mcp-changelog-gen
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: changelog
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/changelog-gen/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
